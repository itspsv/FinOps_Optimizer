# Non-secret defaults. Secrets (API keys) live in .env.
# Any value here can be overridden by an env var, e.g. FINOPS_PREMIUM__MODEL.

log_level: INFO

# Homebrew Postgres over the local socket; no password needed.
database_url: postgresql:///finops

premium:
  name: groq
  base_url: https://api.groq.com/openai/v1
  # Groq free-tier model; Llama 3.3 70B is enterprise-only as of Oct 2026.
  model: openai/gpt-oss-120b
  timeout_s: 60

# Free tier: Ollama's OpenAI-compatible endpoint on this machine.
local:
  name: ollama
  base_url: http://localhost:11434/v1
  model: llama3.2:3b
  # Measured on an M1 8 GB: ~22 output tok/s, so 512 tokens is ~23 s worst case.
  timeout_s: 30

routing:
  enabled: true
  # Part of every cache key; bump it when routing rules change so old answers expire.
  policy_version: v2
  # grounded (v2): local only for tasks it can do from the given text (classify,
  # summarize, extract, rewrite, questions with a passage); open knowledge questions
  # and math word problems go premium. permissive (v1): anything not flagged complex
  # goes local. Benchmark run full-1 (v1) judged only 54% of local answers acceptable.
  local_policy: grounded
  # Requests above these sizes always go to premium (local is slow on long text).
  local_max_prompt_tokens: 1500
  local_max_completion_tokens: 512
  # Sent to the local model only; the benchmark showed 3B answers to open questions
  # running 15-30 s and often hitting the token cap without it. Set to null to disable.
  local_system_prompt: >-
    Answer concisely and directly, in at most about 150 words,
    unless the task clearly needs a longer answer.
  # Complexity score at or above this goes to premium. See finops/router/classifier.py.
  complexity_threshold: 2
  # After this many local failures in a row, skip local for cooldown_s.
  breaker_failure_threshold: 3
  breaker_cooldown_s: 30

cache:
  enabled: true
  # Cosine similarity needed for a semantic hit. Calibrated on 2,000 Quora pairs
  # (`make bench-calibrate`): precision 0.89 vs 0.80 at the old 0.92.
  similarity_threshold: 0.96
  ttl_s: 86400
  # Requests above this temperature want varied answers, so we don't cache them.
  max_temperature: 1.0
  # ONNX model via fastembed: ~70 MB on disk, no PyTorch needed.
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_dim: 384
  model_cache_dir: ~/.cache/finops/fastembed

ledger:
  # Records every request in the request_log table. Prices: config/pricing.yaml.
  enabled: true
