[project]
name = "ai-finops-optimizer"
version = "0.1.0"
description = "Local-first LLM proxy that cuts API costs with semantic caching and dynamic routing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings[yaml]>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "langgraph>=0.2",
    "pyyaml>=6",
    "streamlit>=1.40",
    "altair>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
